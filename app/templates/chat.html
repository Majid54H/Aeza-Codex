<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeza Codex — Chat</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Aeza Codex</h1>
            <p>Ask questions about your knowledge base</p>
        </header>
        <main id="chat-app">
            <div id="messages"></div>
            <div id="loading-indicator" class="loading-indicator" aria-live="polite" aria-atomic="true"></div>
            <form id="chat-form">
                <input type="text" id="message-input" placeholder="Type your question..." autocomplete="off">
                <button type="submit" id="send-button">Send</button>
            </form>
        </main>
    </div>
    <script src="/static/js/chat.js"></script>
</body>
</html>
