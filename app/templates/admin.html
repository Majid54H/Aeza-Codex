<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeza Codex — Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container admin-page">
        <header>
            <h1>Aeza Codex Admin</h1>
            <p>Configure your chatbot, knowledge sources, and branding</p>
        </header>
        <main>
            <section id="dashboard-section">
                <h2>Dashboard</h2>
                <div class="stat-grid">
                    <article class="stat-card">
                        <p class="stat-label">Chatbot name</p>
                        <p id="stat-name" class="stat-value">Aeza Codex</p>
                    </article>
                    <article class="stat-card">
                        <p class="stat-label">Knowledge sources</p>
                        <p id="stat-count" class="stat-value">0</p>
                    </article>
                    <article class="stat-card">
                        <p class="stat-label">Status</p>
                        <p id="stat-status" class="stat-value">No knowledge</p>
                    </article>
                </div>
            </section>

            <section id="knowledge-section">
                <h2>Knowledge</h2>
                <form id="upload-form" enctype="multipart/form-data">
                    <label for="file-input">Upload document (PDF, DOCX, TXT)</label>
                    <div class="form-row">
                        <input type="file" id="file-input" accept=".txt,.pdf,.docx">
                        <button type="submit">Upload &amp; Index</button>
                    </div>
                </form>
                <form id="url-form">
                    <label for="url-input">Website URL</label>
                    <div class="form-row">
                        <input type="url" id="url-input" placeholder="https://example.com" autocomplete="off">
                        <button type="submit">Save URL</button>
                    </div>
                    <p class="hint">Saved as a pending source. Website crawling is not enabled yet.</p>
                </form>
                <p id="upload-status" class="upload-status" aria-live="polite"></p>
                <h3>Sources</h3>
                <ul id="document-list"></ul>
                <div id="actions-section">
                    <button id="reindex-btn" type="button">Re-index All</button>
                </div>
            </section>

            <section id="customize-section">
                <h2>Customize</h2>
                <form id="settings-form">
                    <label for="chatbot-name">Chatbot name</label>
                    <input type="text" id="chatbot-name" maxlength="80" required>

                    <label for="welcome-message">Welcome message</label>
                    <textarea id="welcome-message" rows="3" maxlength="300" required></textarea>

                    <label for="primary-color">Primary color</label>
                    <div class="form-row">
                        <input type="color" id="primary-color" value="#6366f1">
                        <input type="text" id="primary-color-text" value="#6366f1" maxlength="20">
                    </div>

                    <label for="logo-url">Logo URL (optional)</label>
                    <input type="url" id="logo-url" placeholder="https://example.com/logo.png">

                    <button type="submit">Save branding</button>
                </form>
                <p id="settings-status" class="upload-status" aria-live="polite"></p>
            </section>
        </main>
    </div>
    <script src="/static/js/admin.js"></script>
</body>
</html>
